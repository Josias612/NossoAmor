<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Amor ❤️</title>

<style>
:root{
  --rose:#ff7aa8;
  --wine:#3b0622;
  --dark:#100009;
  --cream:#fff4ea;
  --glass:rgba(255,255,255,.13);
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  min-height:100%;
  overflow:hidden;
  font-family:Inter, "Segoe UI", Arial, sans-serif;
  color:white;
  background:#12000b;
}

body{
  height:100vh;
  background:
    radial-gradient(circle at 12% 12%,rgba(255,215,229,.55),transparent 24%),
    radial-gradient(circle at 88% 22%,rgba(255,122,168,.28),transparent 26%),
    radial-gradient(circle at 50% 120%,rgba(255,170,197,.28),transparent 40%),
    linear-gradient(145deg,#13000b 0%,#32051f 42%,#7a1e46 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:-30%;
  background:
    conic-gradient(from 180deg at 50% 50%,transparent,#ffffff18,transparent,#ff8db52b,transparent);
  animation:aurora 18s infinite linear;
  filter:blur(35px);
  opacity:.85;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at center,black,transparent 78%);
  pointer-events:none;
}

@keyframes aurora{
  to{transform:rotate(360deg)}
}

/* INTRO */
.intro{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top,#fff0f6 0%,#ff9fbd 26%,#5a1233 68%,#110009 100%);
  transition:opacity 1.1s ease,visibility 1.1s ease;
}

.intro.hidden{
  opacity:0;
  visibility:hidden;
}

.coverImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.coverBtn{
  position:absolute;
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
  z-index:30;
  min-width:260px;
  height:60px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  color:#fff;
  font-size:1.15rem;
  font-weight:600;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 0 25px rgba(255,140,190,.35),0 15px 35px rgba(0,0,0,.35);
  cursor:pointer;
  transition:.3s;
}

.coverBtn:hover{
  transform:translateX(-50%) scale(1.03);
}

.coverBtn:active{
  transform:translateX(-50%) scale(.96);
}


.introCard{
  width:min(92vw,430px);
  padding:32px 24px;
  text-align:center;
  border-radius:34px;
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 35px 90px rgba(0,0,0,.42);
  animation:introUp 1.3s cubic-bezier(.2,.8,.2,1);
}

@keyframes introUp{
  from{opacity:0;transform:translateY(38px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.introIcon{
  width:92px;
  height:92px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  border-radius:30px;
  background:linear-gradient(135deg,#fff8,#fff1);
  font-size:3rem;
  animation:softBeat 2.2s infinite ease-in-out;
  box-shadow:inset 0 0 25px #fff6,0 20px 45px #0003;
}

@keyframes softBeat{
  50%{transform:scale(1.06) rotate(-2deg)}
}

.intro h1{
  font-family:Georgia,serif;
  font-size:2rem;
  line-height:1.08;
  letter-spacing:-.04em;
  margin-bottom:12px;
}

.intro p{
  font-size:1rem;
  line-height:1.55;
  color:#fff6f9;
  margin-bottom:22px;
}

.startBtn{
  border:none;
  padding:14px 25px;
  border-radius:999px;
  color:#7d1846;
  background:linear-gradient(135deg,#fff,#ffe5ef);
  font-weight:800;
  font-size:1rem;
  box-shadow:0 18px 40px rgba(0,0,0,.28);
  cursor:pointer;
  transition:.25s ease;
}

.startBtn:active{transform:scale(.96)}

/* MAIN */
.app{
  position:relative;
  z-index:3;
  height:100vh;
  padding:18px 14px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.frame{
  width:min(94vw,450px);
  position:relative;
  animation:enterApp 1s .2s both ease;
}

@keyframes enterApp{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.kicker{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding:8px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);
  font-size:.78rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#ffeaf2;
  backdrop-filter:blur(14px);
}

.title{
  margin-top:13px;
  font-family:Georgia, "Times New Roman", serif;
  font-weight:500;
  font-size:clamp(2rem,8vw,3.1rem);
  letter-spacing:-.08em;
  line-height:.95;
  text-shadow:0 18px 45px rgba(0,0,0,.35);
}

.album{
  position:relative;
  padding:12px;
  border-radius:36px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.3);
  box-shadow:
    0 30px 90px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.32);
  backdrop-filter:blur(20px);
}

.album::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:-1;
  border-radius:38px;
  background:linear-gradient(90deg,#ffffff90,#ff8db540,#ffffff30);
  filter:blur(12px);
  opacity:.45;
}

.photoArea{
  position:relative;
  height:min(64vh,500px);
  min-height:360px;
  border-radius:28px;
  overflow:hidden;
  background:#2b1021;
  isolation:isolate;
}

.photoArea img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.12);
  filter:saturate(1.05) contrast(1.04);
  transition:opacity 1.15s ease, transform 6s ease;
}

.photoArea img.active{
  opacity:1;
  transform:scale(1.01);
  animation:kenburns 7s ease forwards;
}

@keyframes kenburns{
  from{transform:scale(1.12) translateY(8px)}
  to{transform:scale(1.02) translateY(-6px)}
}

.photoArea::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top,rgba(0,0,0,.65),transparent 48%),
    radial-gradient(circle at top,transparent 50%,rgba(30,0,16,.24));
  z-index:2;
  pointer-events:none;
}

.ribbon{
  position:absolute;
  z-index:5;
  left:18px;
  top:18px;
  display:flex;
  gap:7px;
  align-items:center;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.22);
  font-size:.82rem;
}

.phraseBox{
  position:absolute;
  z-index:4;
  left:16px;
  right:16px;
  bottom:16px;
  padding:17px 16px;
  border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.09));
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);
}

.phrase{
  font-family:Georgia,serif;
  font-size:clamp(1.08rem,4.6vw,1.45rem);
  line-height:1.42;
  text-shadow:0 4px 18px rgba(0,0,0,.45);
}

.phrase.change{
  animation:phraseIn .9s cubic-bezier(.18,.85,.2,1);
}

@keyframes phraseIn{
  from{opacity:0;transform:translateY(20px);filter:blur(8px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}

.progress{
  margin-top:13px;
  height:5px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.15);
}

.bar{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#fff,#ffc7dc,#fff);
  animation:loadBar 6.5s linear infinite;
}

@keyframes loadBar{
  from{width:0%}
  to{width:100%}
}

.footerText{
  margin-top:10px;
  text-align:center;
  font-size:.84rem;
  color:#ffe8f1;
  opacity:.9;
}

/* FOFURAS */
/* Patinho cinematográfico modelado em HTML + CSS, sem imagem estática e sem emoji */
.duck{
  position:fixed;
  z-index:10;
  left:0;
  bottom:7.2vh;
  width:clamp(96px,13.5vw,142px);
  height:clamp(105px,15vw,158px);
  pointer-events:none;
  transform-style:preserve-3d;
  perspective:800px;
  animation:duckTravel 23s linear infinite;
  filter:drop-shadow(0 26px 24px rgba(0,0,0,.38));
  will-change:transform;
}

.duck::after{
  content:"";
  position:absolute;
  left:10%;
  right:5%;
  bottom:-10%;
  height:13%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.38),rgba(0,0,0,.13) 48%,transparent 72%);
  filter:blur(4px);
  animation:duckShadow 540ms ease-in-out infinite alternate;
}

.duckModel{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transform-origin:50% 91%;
  animation:duckBounce 540ms cubic-bezier(.45,0,.55,1) infinite alternate;
}

.duckGlow{
  position:absolute;
  inset:6% 1% 2%;
  border-radius:50%;
  background:radial-gradient(circle at 38% 18%,rgba(255,255,255,.45),transparent 22%),radial-gradient(circle at 58% 52%,rgba(255,205,80,.4),transparent 48%);
  filter:blur(10px);
  opacity:.6;
  transform:translateZ(-10px);
}

.duckBody{
  position:absolute;
  left:20%;
  bottom:15%;
  width:61%;
  height:56%;
  border-radius:53% 48% 48% 50% / 58% 58% 44% 43%;
  background:
    radial-gradient(circle at 27% 17%,rgba(255,255,255,.92) 0 7%,transparent 9%),
    radial-gradient(circle at 24% 28%,rgba(255,251,192,.78) 0 18%,transparent 31%),
    radial-gradient(circle at 78% 76%,rgba(161,83,0,.36) 0 18%,transparent 42%),
    repeating-radial-gradient(circle at 44% 35%,rgba(255,250,170,.24) 0 1px,transparent 1.2px 3.7px),
    linear-gradient(145deg,#fff6a4 0%,#ffe06a 28%,#ffc038 62%,#de8615 100%);
  box-shadow:
    inset -15px -13px 23px rgba(124,67,0,.24),
    inset 12px 8px 18px rgba(255,255,255,.42),
    0 16px 28px rgba(0,0,0,.24);
  transform:rotate(-3deg) translateZ(18px);
  overflow:visible;
}

.duckBody::before{
  content:"";
  position:absolute;
  inset:7% 9% 8% 6%;
  border-radius:inherit;
  background:
    radial-gradient(circle at 15% 22%,rgba(255,255,255,.34) 0 1px,transparent 2px),
    radial-gradient(circle at 31% 37%,rgba(255,255,255,.22) 0 1px,transparent 2px),
    radial-gradient(circle at 55% 20%,rgba(255,255,255,.2) 0 1px,transparent 2px),
    radial-gradient(circle at 70% 57%,rgba(183,99,0,.14) 0 1px,transparent 2px);
  background-size:18px 18px,21px 21px,24px 24px,19px 19px;
  opacity:.75;
  mix-blend-mode:soft-light;
}

.duckTail{
  position:absolute;
  right:5%;
  bottom:38%;
  width:33%;
  height:24%;
  border-radius:22% 78% 56% 63%;
  background:linear-gradient(145deg,#ffe875 0%,#ffc23c 64%,#d47c10 100%);
  box-shadow:inset -7px -6px 10px rgba(111,60,0,.24),inset 5px 4px 9px rgba(255,255,255,.34);
  transform-origin:15% 70%;
  transform:rotate(22deg) translateZ(12px);
  animation:tailWag 720ms ease-in-out infinite alternate;
}

.duckWing{
  position:absolute;
  left:16%;
  bottom:37%;
  width:42%;
  height:31%;
  border-radius:70% 44% 66% 44%;
  background:
    radial-gradient(circle at 33% 18%,rgba(255,255,255,.58),transparent 16%),
    repeating-radial-gradient(circle at 45% 48%,rgba(255,255,210,.18) 0 1px,transparent 1.4px 4px),
    linear-gradient(145deg,#ffe982 0%,#ffc23b 70%,#d68111 100%);
  box-shadow:inset -10px -7px 13px rgba(120,67,0,.24),inset 7px 5px 10px rgba(255,255,255,.3);
  transform-origin:82% 36%;
  transform:rotate(12deg) translateZ(33px);
  animation:wingFlap 670ms ease-in-out infinite alternate;
}

.duckHead{
  position:absolute;
  left:36%;
  bottom:57%;
  width:48%;
  height:42%;
  border-radius:50% 52% 47% 50%;
  background:
    radial-gradient(circle at 28% 15%,rgba(255,255,255,.95) 0 8%,transparent 10%),
    radial-gradient(circle at 32% 28%,rgba(255,252,198,.83) 0 19%,transparent 34%),
    radial-gradient(circle at 76% 77%,rgba(194,100,0,.28) 0 20%,transparent 46%),
    repeating-radial-gradient(circle at 50% 42%,rgba(255,251,186,.18) 0 1px,transparent 1.4px 3.5px),
    linear-gradient(145deg,#fff8b0 0%,#ffe06d 42%,#ffc039 100%);
  box-shadow:
    inset -12px -10px 18px rgba(126,69,0,.23),
    inset 10px 7px 14px rgba(255,255,255,.48),
    0 12px 22px rgba(0,0,0,.22);
  transform:translateZ(45px);
  transform-origin:48% 78%;
  animation:headNod 1.08s ease-in-out infinite alternate;
}

.duckHead::after{
  content:"";
  position:absolute;
  left:9%;
  right:9%;
  bottom:10%;
  height:21%;
  border-radius:50%;
  background:radial-gradient(circle at 12% 45%,rgba(255,123,160,.4) 0 25%,transparent 27%),radial-gradient(circle at 88% 45%,rgba(255,123,160,.34) 0 24%,transparent 26%);
  filter:blur(.3px);
}

.duckFluff,
.duckFluff::before,
.duckFluff::after{
  position:absolute;
  content:"";
  width:30%;
  height:28%;
  left:36%;
  top:-18%;
  border-radius:50%;
  border-top:5px solid #ffec82;
  border-left:3px solid transparent;
  transform:rotate(-18deg);
  filter:drop-shadow(0 2px 1px rgba(129,72,0,.18));
}
.duckFluff::before{left:-48%;top:16%;transform:rotate(-31deg);border-top-color:#ffe36c}
.duckFluff::after{left:50%;top:13%;transform:rotate(31deg);border-top-color:#fff19b}

.duckEye{
  position:absolute;
  top:36%;
  width:18%;
  height:23%;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 22%,#fff 0 15%,transparent 17%),
    radial-gradient(circle at 58% 65%,#32180b 0 38%,#120603 68%,#000 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.3), inset 0 0 2px rgba(255,255,255,.26);
  animation:blink 6.2s infinite;
  z-index:4;
}
.duckEye.left{left:22%}
.duckEye.right{right:18%}

.duckBeak{
  position:absolute;
  left:32%;
  top:56%;
  width:50%;
  height:24%;
  border-radius:64% 66% 59% 60%;
  background:
    radial-gradient(circle at 25% 25%,rgba(255,255,255,.44),transparent 17%),
    linear-gradient(145deg,#ffb852 0%,#f8891f 62%,#c95005 100%);
  box-shadow:inset -6px -4px 8px rgba(110,39,0,.25),inset 4px 3px 6px rgba(255,255,255,.24),0 3px 6px rgba(0,0,0,.16);
  transform:translateZ(20px);
  z-index:6;
}
.duckBeak::after{
  content:"";
  position:absolute;
  left:14%;
  right:12%;
  top:56%;
  height:2px;
  border-radius:99px;
  background:rgba(116,42,0,.34);
}

.duckRose{
  position:absolute;
  left:-42%;
  top:62%;
  width:80%;
  height:21%;
  transform-origin:94% 40%;
  transform:rotate(1deg) translateZ(65px);
  z-index:8;
  animation:roseSway 1.08s ease-in-out infinite alternate;
}
.roseStem{
  position:absolute;
  right:0;
  top:42%;
  width:86%;
  height:21%;
  border-radius:99px;
  background:linear-gradient(90deg,#153f1e,#3a8d40 50%,#1f4e21);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.26);
}
.roseLeaf{
  position:absolute;
  right:19%;
  top:66%;
  width:21%;
  height:42%;
  border-radius:100% 0 100% 0;
  background:linear-gradient(135deg,#5ebd58,#1f7430 68%,#14521f);
  transform:rotate(33deg);
  box-shadow:inset -3px -2px 4px rgba(0,0,0,.2);
}
.roseLeaf::after{
  content:"";
  position:absolute;
  left:22%;
  top:47%;
  width:72%;
  height:1px;
  background:rgba(197,255,188,.52);
  transform:rotate(28deg);
}
.roseFlower{
  position:absolute;
  left:0;
  top:-18%;
  width:36%;
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle at 46% 46%,#ff9caf 0 7%,transparent 9%),
    conic-gradient(from 12deg,#73001d,#b90037,#ff496e,#98002c,#e51a52,#650019,#c1083d,#ff7190,#7c0021);
  box-shadow:inset -6px -6px 9px rgba(63,0,16,.38),inset 5px 4px 7px rgba(255,255,255,.24),0 4px 9px rgba(120,0,35,.38);
}
.roseFlower::before,
.roseFlower::after{
  content:"";
  position:absolute;
  inset:16%;
  border-radius:50%;
  border:2px solid rgba(255,185,197,.46);
  transform:rotate(28deg);
}
.roseFlower::after{inset:33%;border-color:rgba(89,0,24,.4);transform:rotate(-18deg)}

.duckFeet{
  position:absolute;
  left:28%;
  bottom:2%;
  width:48%;
  height:20%;
  z-index:1;
}
.duckLeg{
  position:absolute;
  bottom:34%;
  width:8%;
  height:42%;
  border-radius:99px;
  background:linear-gradient(#d56508,#a63a02);
}
.duckLeg.left{left:20%}
.duckLeg.right{right:26%}
.duckFoot{
  position:absolute;
  bottom:0;
  width:46%;
  height:42%;
  border-radius:68% 45% 66% 36%;
  background:linear-gradient(145deg,#ffb64b 0%,#f07d15 70%,#bc4c04 100%);
  box-shadow:inset -4px -3px 5px rgba(82,28,0,.26),0 3px 3px rgba(0,0,0,.16);
  transform-origin:62% 50%;
}
.duckFoot.left{left:0;animation:footLeft 540ms ease-in-out infinite alternate}
.duckFoot.right{right:0;animation:footRight 540ms ease-in-out infinite alternate}

.duckSparkle{
  position:absolute;
  width:9%;
  aspect-ratio:1;
  opacity:0;
  z-index:9;
  filter:drop-shadow(0 0 7px rgba(255,205,225,.9));
  animation:sparkle 3.2s ease-in-out infinite;
}
.duckSparkle::before{
  content:"";
  position:absolute;
  inset:0;
  background:#fff7db;
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
}
.duckSparkle.s1{left:8%;top:19%}
.duckSparkle.s2{right:2%;top:32%;animation-delay:.85s}
.duckSparkle.s3{left:71%;top:4%;animation-delay:1.6s}

@keyframes duckTravel{
  0%{transform:translateX(-190px) translateY(0) scale(.78) rotateY(0deg)}
  9%{transform:translateX(4vw) translateY(-6px) scale(.83) rotateY(-7deg)}
  23%{transform:translateX(26vw) translateY(3px) scale(.8) rotateY(5deg)}
  39%{transform:translateX(52vw) translateY(-9px) scale(.86) rotateY(-5deg)}
  55%{transform:translateX(80vw) translateY(2px) scale(.81) rotateY(4deg)}
  66%{transform:translateX(calc(100vw + 210px)) translateY(0) scale(.78) rotateY(0deg)}
  100%{transform:translateX(calc(100vw + 210px)) translateY(0) scale(.78) rotateY(0deg)}
}
@keyframes duckBounce{from{transform:rotateZ(-1.4deg) translateY(0)}to{transform:rotateZ(1.7deg) translateY(-9px)}}
@keyframes duckShadow{from{transform:scaleX(.82);opacity:.48}to{transform:scaleX(1.12);opacity:.29}}
@keyframes headNod{from{transform:translateZ(45px) rotate(-3deg) translateY(1px)}to{transform:translateZ(45px) rotate(3.5deg) translateY(-3px)}}
@keyframes wingFlap{from{transform:rotate(12deg) translateZ(33px)}to{transform:rotate(-13deg) translateZ(33px)}}
@keyframes tailWag{to{transform:rotate(34deg) translateY(-2px) translateZ(12px)}}
@keyframes footLeft{from{transform:translateX(-5px) rotate(13deg)}to{transform:translateX(8px) rotate(-12deg)}}
@keyframes footRight{from{transform:translateX(8px) rotate(-13deg)}to{transform:translateX(-6px) rotate(12deg)}}
@keyframes roseSway{from{transform:rotate(-5deg) translateY(1px) translateZ(65px)}to{transform:rotate(7deg) translateY(-1px) translateZ(65px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.35) rotate(0)}42%{opacity:.95;transform:scale(1.05) rotate(180deg)}68%{opacity:.28;transform:scale(.72) rotate(260deg)}}

.loveNote{
  position:fixed;
  z-index:2;
  padding:7px 10px;
  border-radius:15px;
  color:#5b1233;
  background:#fff8;
  backdrop-filter:blur(10px);
  font-size:.8rem;
  font-weight:700;
  box-shadow:0 12px 28px #0002;
  opacity:0;
  animation:noteFloat 9s linear forwards;
  pointer-events:none;
}

@keyframes noteFloat{
  0%{opacity:0;transform:translateY(0) rotate(-5deg) scale(.8)}
  10%{opacity:.9}
  90%{opacity:.9}
  100%{opacity:0;transform:translateY(-110vh) rotate(8deg) scale(1.1)}
}

.particle{
  position:fixed;
  z-index:1;
  bottom:-35px;
  pointer-events:none;
  animation:rise linear forwards;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));
}

@keyframes rise{
  to{transform:translateY(-115vh) rotate(360deg);opacity:0}
}

.toast{
  position:fixed;
  z-index:30;
  left:50%;
  top:18px;
  width:min(92vw,410px);
  transform:translateX(-50%);
  padding:13px 15px;
  border-radius:18px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.26);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  text-align:center;
  font-size:.92rem;
  opacity:0;
  pointer-events:none;
  transition:.45s ease;
}

.toast.show{opacity:1;top:26px}

@media(max-width:480px){
  .app{padding:14px 10px}
  .header{margin-bottom:12px}
  .photoArea{height:63vh;min-height:360px}
  .album{border-radius:31px;padding:10px}
  .photoArea{border-radius:24px}
  .phraseBox{left:12px;right:12px;bottom:12px;padding:15px}
  .duck{bottom:7vh;width:76px;height:68px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<section class="intro" id="intro">
    <img src="inicio.png" class="coverImage" alt="Capa">
    <button class="startBtn coverBtn" id="startBtn">Toque para começar</button>
</section>

<div class="toast" id="toast">Carregando nossas fotos...</div>

<div class="duck" aria-hidden="true">
  <div class="duckModel">
    <div class="duckGlow"></div>
    <div class="duckSparkle s1"></div>
    <div class="duckSparkle s2"></div>
    <div class="duckSparkle s3"></div>
    <div class="duckFeet">
      <div class="duckLeg left"></div>
      <div class="duckLeg right"></div>
      <div class="duckFoot left"></div>
      <div class="duckFoot right"></div>
    </div>
    <div class="duckTail"></div>
    <div class="duckBody"></div>
    <div class="duckWing"></div>
    <div class="duckHead">
      <div class="duckFluff"></div>
      <div class="duckEye left"></div>
      <div class="duckEye right"></div>
      <div class="duckBeak"></div>
      <div class="duckRose">
        <div class="roseStem"></div>
        <div class="roseLeaf"></div>
        <div class="roseFlower"></div>
      </div>
    </div>
  </div>
</div>

<main class="app">
  <section class="frame">
    <header class="header">
      <div class="kicker">feito com carinho ✦ sem pressa</div>
      <h1 class="title">Nossa pequena história</h1>
    </header>

    <div class="album">
      <div class="photoArea">
        <img id="fotoA" alt="Nossa foto">
        <img id="fotoB" alt="Nossa foto">
        <div class="ribbon" id="counter">♡ lembrança</div>
        <div class="phraseBox">
          <div class="phrase" id="phrase">Carregando nossas lembranças...</div>
          <div class="progress"><div class="bar" id="bar"></div></div>
        </div>
      </div>
    </div>

    <div class="footerText" id="footerText">um pedacinho bonito guardado aqui</div>
  </section>
</main>

<script>
const totalFotos = 300;

/*
  Coloque as imagens junto do index.html:
  1.jpg, 2.jpg, 3.jpg...

  Também funciona se você colocar dentro da pasta fotos:
  fotos/1.jpg, fotos/2.jpg...
*/
const caminhos = ["", "fotos/"];

let imagens = [];
let indice = 0;
let usandoA = true;
let slideshowTimer = null;

const frases = [
"Você chegou de um jeito simples e deixou tudo mais bonito.",
"Tem coisas que não precisam de muito texto: meu coração escolheu você.",
"Gosto da paz que existe quando penso em nós dois.",
"Você é aquele detalhe que melhora o dia inteiro.",
"Algumas lembranças viram casa dentro da gente. Você virou.",
"Eu gosto do seu jeito, do seu riso e da calma que você traz.",
"Com você, até o silêncio parece companhia boa.",
"Meu coração fica leve quando a lembrança é você.",
"Não é exagero, é carinho guardado há tempo demais.",
"Você é uma dessas pessoas raras que fazem o mundo parecer mais gentil.",
"Eu gosto da nossa história porque ela tem verdade.",
"Seu sorriso tem um jeito bonito de ficar na memória.",
"Tem foto que guarda um segundo. Tem pessoa que guarda a vida.",
"Você é meu pensamento bonito no meio de um dia comum.",
"Eu não quero pressa. Quero presença, carinho e nós dois.",
"Se carinho fosse lugar, eu moraria no seu abraço.",
"Você faz o simples parecer especial.",
"Eu gosto da forma como meu coração fica quando é você.",
"Nosso amor não precisa gritar. Ele aparece nos detalhes.",
"Você é a parte calma de muita coisa dentro de mim.",
"Eu te escolheria nos dias bons e também nos dias difíceis.",
"Tem uma beleza tranquila em tudo que lembra você.",
"Você é lembrança boa antes mesmo do dia terminar.",
"Meu mundo fica mais bonito quando você aparece nele.",
"Eu gosto de você de um jeito leve, sincero e inteiro.",
"Você é poesia sem precisar rimar.",
"Algumas pessoas passam. Você ficou de um jeito bonito.",
"Seu carinho tem som de lar.",
"Não existe perfeição aqui, existe verdade. E isso é mais bonito.",
"Você é meu motivo favorito para sorrir do nada.",
"Eu guardo nós dois com cuidado no peito.",
"Te amar é uma forma bonita de agradecer pela vida.",
"Você é o tipo de pessoa que a alma reconhece.",
"Quando penso em futuro, gosto quando você aparece nele.",
"Meu carinho por você cabe em tudo, menos em poucas palavras.",
"Você é a pausa bonita que meu coração precisava.",
"Com você, o tempo parece andar mais manso.",
"Eu gosto de tudo que fica mais bonito quando é com você.",
"Você me lembra que amor também pode ser paz.",
"Nos detalhes pequenos, eu encontro grandes motivos para te amar.",
"Tem um universo inteiro em cada lembrança nossa.",
"Você é meu acaso preferido.",
"Eu não quero um amor perfeito. Quero um amor nosso.",
"Seu jeito mora em mim de uma forma bonita.",
"Se eu pudesse guardar um lugar no mundo, seria ao seu lado.",
"Você faz falta até quando acabou de ir embora.",
"Meu coração aprendeu seu nome de um jeito especial.",
"Você é meu carinho favorito em forma de pessoa.",
"Eu gosto da nossa bagunça, da nossa calma e dos nossos detalhes.",
"Que a vida seja gentil com nós dois.",
"Você é luz baixa, café quente e abraço demorado.",
"Eu amo a forma como você transforma lembranças em saudade boa.",
"Não tem nada brega em sentir bonito por alguém raro.",
"Eu gosto de nós porque parece verdade até nos detalhes pequenos.",
"Você é o melhor lugar para onde meu pensamento corre.",
"Meu coração sorri baixinho quando lembra de você.",
"Alguns encontros parecem resposta. Você pareceu.",
"Você é meu capítulo favorito, mesmo nos dias sem título.",
"Eu quero viver coisas simples com você e chamar isso de felicidade.",
"Você é a delicadeza que deixou minha vida mais bonita."
];

const miniNotas = [
"você + eu",
"saudade boa",
"meu lugar",
"carinho",
"nós dois",
"calma bonita",
"amor leve",
"lembrança",
"meu sorriso"
];

const fotoA = document.getElementById("fotoA");
const fotoB = document.getElementById("fotoB");
const phrase = document.getElementById("phrase");
const counter = document.getElementById("counter");
const footerText = document.getElementById("footerText");
const toast = document.getElementById("toast");
const bar = document.getElementById("bar");

document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("intro").classList.add("hidden");
  showToast("A surpresa começou ❤️");
  startEffects();
});

function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}

async function existeImagem(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => resolve(null);
    img.src = src + "?v=" + Date.now();
  });
}

async function carregarFotos(){
  showToast("Procurando as fotos...");
  const achadas = [];

  for(let i = 1; i <= totalFotos; i++){
    let encontrou = false;

    for(const pasta of caminhos){
      const src = `${pasta}${i}.jpg`;
      const ok = await existeImagem(src);
      if(ok){
        achadas.push(`${pasta}${i}.jpg`);
        encontrou = true;
        break;
      }
    }

    if(i > 35 && !encontrou && achadas.length > 0){
      let proximasVazias = 0;
      for(let j = i; j < i + 10; j++){
        const teste = await existeImagem(`${caminhos[0]}${j}.jpg`);
        if(!teste) proximasVazias++;
      }
      if(proximasVazias >= 10) break;
    }
  }

  imagens = achadas.sort(() => Math.random() - .5);

  if(imagens.length === 0){
    phrase.textContent = "Nenhuma foto foi encontrada. Coloque as imagens como 1.jpg, 2.jpg, 3.jpg... junto do index.html ou dentro da pasta fotos.";
    counter.textContent = "nenhuma imagem encontrada";
    return;
  }

  showToast(`${imagens.length} lembrança(s) encontradas ✨`);
  iniciar();
}

function iniciar(){
  trocar();
  clearInterval(slideshowTimer);
  slideshowTimer = setInterval(trocar, 6500);
}

function reiniciarBarra(){
  bar.style.animation = "none";
  void bar.offsetWidth;
  bar.style.animation = "loadBar 6.5s linear infinite";
}

function trocar(){
  if(!imagens.length) return;

  const atual = usandoA ? fotoA : fotoB;
  const proxima = usandoA ? fotoB : fotoA;

  proxima.src = imagens[indice];
  proxima.classList.add("active");
  atual.classList.remove("active");

  phrase.classList.remove("change");
  void phrase.offsetWidth;
  phrase.textContent = frases[Math.floor(Math.random() * frases.length)];
  phrase.classList.add("change");

  counter.textContent = `♡ lembrança ${indice + 1} de ${imagens.length}`;
  footerText.textContent = indice % 3 === 0
    ? "feito para guardar momentos, não apenas fotos"
    : indice % 3 === 1
    ? "um carinho em forma de página"
    : "cada detalhe aqui lembra você";

  indice = (indice + 1) % imagens.length;
  usandoA = !usandoA;
  reiniciarBarra();
}

function startEffects(){
  setInterval(criarParticula, 220);
  setInterval(criarNota, 3100);
}

function criarParticula(){
  const el = document.createElement("div");
  el.className = "particle";
  const itens = ["♡","✦","❀","·","❤"];
  el.textContent = itens[Math.floor(Math.random()*itens.length)];
  el.style.left = Math.random()*100 + "vw";
  el.style.fontSize = (Math.random()*18 + 11) + "px";
  el.style.color = Math.random() > .55 ? "rgba(255,255,255,.85)" : "rgba(255,205,224,.9)";
  el.style.opacity = Math.random()*.65 + .25;
  el.style.animationDuration = (Math.random()*5 + 6) + "s";
  el.style.transform = `translateX(${Math.random()*50-25}px)`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 12000);
}

function criarNota(){
  const el = document.createElement("div");
  el.className = "loveNote";
  el.textContent = miniNotas[Math.floor(Math.random()*miniNotas.length)];
  el.style.left = Math.random()*78 + 8 + "vw";
  el.style.bottom = "-40px";
  el.style.animationDuration = (Math.random()*3 + 8) + "s";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 12000);
}

carregarFotos();
setTimeout(() => startEffects(), 1200);
</script>

</body>
</html>
